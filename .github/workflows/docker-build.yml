name: Build and Push Flannel (AMD64)

on:
  push:
    branches:
    - main
    - 'feat/**'
  workflow_dispatch:


jobs:
  # [Job 1] 빌드 및 푸시
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: images/Dockerfile
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:latest
        build-args: |
          TAG=${{ github.sha }}

  # [Job 2] 배포 (이미지 교체)
  deploy:
    needs: build-and-push
    runs-on: [ self-hosted, linux ]
    steps:
    - name: Update Flannel CNI
      run: |
        echo "=== 1. Deploying to Kubernetes Cluster ==="

        NS="kube-flannel"
        DS="kube-flannel-ds"
        CONTAINER="kube-flannel"
        IMAGE="${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ github.sha }}"

        echo "Target: $NS / $DS"
        echo "New Image: $IMAGE"

        # 이미지 교체
        kubectl set image daemonset/$DS -n $NS $CONTAINER=$IMAGE

        # 재시작 트리거
        kubectl rollout restart daemonset/$DS -n $NS

        # 완료 대기
        kubectl rollout status daemonset/$DS -n $NS

        echo "=== Flannel Update Complete! ==="
        kubectl get ds $DS -n $NS -o wide

  # [Job 3] 네트워크 검증 (Ping Test)
  e2e-test:
    needs: deploy
    runs-on: [ self-hosted, linux ]
    steps:
    - name: Run Network Connectivity Test
      run: |
        echo "=== Starting Connectivity Test (Ping) ==="

        # 1. 청소 및 초기화
        echo "🧹 Cleaning up previous resources..."
        kubectl delete ns net-check --ignore-not-found=true --wait=true

        echo "✨ Creating fresh namespace..."
        kubectl create ns net-check

        # -------------------------------------------------------
        # [Test A] Same Node (Pod -> Pod)
        # -------------------------------------------------------
        echo "[Test A] Preparing Same-Node Pods..."

        NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        echo "Target Node for Same-Node Test: $NODE_NAME"

        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: same-node-test
          namespace: net-check
          labels:
            app: same-node-test
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: same-node-test
          template:
            metadata:
              labels:
                app: same-node-test
            spec:
              containers:
              - name: busybox
                image: busybox
                command: ["sleep", "3600"]
              nodeSelector:
                kubernetes.io/hostname: "$NODE_NAME"
              tolerations:
              - operator: Exists
        EOF

        # -------------------------------------------------------
        # [Test B] Cross Node (Node -> Node)
        # -------------------------------------------------------
        echo "[Test B] Preparing Cross-Node Pods (DaemonSet)..."

        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: cross-node-test
          namespace: net-check
          labels:
            app: cross-node-test
        spec:
          selector:
            matchLabels:
              app: cross-node-test
          template:
            metadata:
              labels:
                app: cross-node-test
            spec:
              containers:
              - name: busybox
                image: busybox
                command: ["sleep", "3600"]
              tolerations:
              - operator: Exists
        EOF

        # -------------------------------------------------------
        # 파드 준비 대기
        # -------------------------------------------------------
        echo "Waiting for test pods to be ready..."
        kubectl rollout status deployment/same-node-test -n net-check
        kubectl rollout status ds/cross-node-test -n net-check

        # -------------------------------------------------------
        # Ping 실행
        # -------------------------------------------------------
        echo ">>> Executing Ping Tests..."

        # [1. Same Node Ping]
        POD_A=$(kubectl get pods -n net-check -l app=same-node-test -o jsonpath='{.items[0].metadata.name}')
        POD_B=$(kubectl get pods -n net-check -l app=same-node-test -o jsonpath='{.items[1].metadata.name}')

        NODE_A=$(kubectl get pod $POD_A -n net-check -o jsonpath='{.spec.nodeName}')
        NODE_B=$(kubectl get pod $POD_B -n net-check -o jsonpath='{.spec.nodeName}')
        IP_B=$(kubectl get pod $POD_B -n net-check -o jsonpath='{.status.podIP}')

        echo "---------------------------------------------------"
        echo "📡 [Same Node Test] Detail Info:"
        echo "   Source: $POD_A (on Node: $NODE_A)"
        echo "   Target: $POD_B (on Node: $NODE_B)"
        echo "   Action: Sending Ping to $IP_B"
        echo "---------------------------------------------------"

        kubectl exec -n net-check $POD_A -- ping -c 3 $IP_B

        # [2. Cross Node Ping]
        NODE_COUNT=$(kubectl get nodes --no-headers | wc -l)
        if [ "$NODE_COUNT" -gt 1 ]; then
          POD_A=$(kubectl get pods -n net-check -l app=cross-node-test -o jsonpath='{.items[0].metadata.name}')
          POD_B=$(kubectl get pods -n net-check -l app=cross-node-test -o jsonpath='{.items[1].metadata.name}')
          
          NODE_A=$(kubectl get pod $POD_A -n net-check -o jsonpath='{.spec.nodeName}')
          NODE_B=$(kubectl get pod $POD_B -n net-check -o jsonpath='{.spec.nodeName}')
          IP_B=$(kubectl get pod $POD_B -n net-check -o jsonpath='{.status.podIP}')
          
          echo "---------------------------------------------------"
          echo "📡 [Cross Node Test] Detail Info:"
          echo "   Source: $POD_A (on Node: $NODE_A)"
          echo "   Target: $POD_B (on Node: $NODE_B)"
          echo "   Action: Sending Ping to $IP_B"
          echo "---------------------------------------------------"
          
          if [ "$NODE_A" == "$NODE_B" ]; then
              echo "⚠️ Warning: Selected pods are on the same node ($NODE_A). Cross-node verification might be limited."
          fi

          kubectl exec -n net-check $POD_A -- ping -c 3 $IP_B
        else
          echo "Skipping Cross Node Test (Single Node Cluster)"
        fi

        # -------------------------------------------------------
        # Cleanup
        # -------------------------------------------------------
        echo "=== All Tests Passed! Cleaning up... ==="
        kubectl delete ns net-check
