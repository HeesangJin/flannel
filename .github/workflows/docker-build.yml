name: Build and Push Flannel (AMD64)

on:
  push:
    branches:
    - main
    - 'feat/**'
  workflow_dispatch:
  repository_dispatch:
    types: [ update-cni-event ]

jobs:
  # [Job 1] 빌드 및 푸시
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: images/Dockerfile
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:latest
        build-args: |
          TAG=${{ github.sha }}

  # [Job 2] 배포 (이미지 교체)
  deploy:
    needs: build-and-push
    runs-on: [ self-hosted, linux ]
    steps:
    - name: Determine Image Tags
      run: |
        # 기본값: 현재 Daemon 커밋 SHA, CNI는 latest
        DAEMON_TAG="${{ github.sha }}"
        CNI_TAG="latest"

        # 만약 CNI 리포에서 신호를 줘서 실행된 거라면?
        if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
           echo "🚀 Triggered by CNI Update Event!"
           # Payload로 넘어온 CNI SHA 사용
           CNI_TAG="${{ github.event.client_payload.cni_sha }}"
           
           # Daemon은 안 바뀌었으니 기존에 안정적인 latest 사용 (또는 현재 SHA 유지)
           # 여기서는 현재 체크아웃된 코드(Daemon)의 SHA를 그대로 씁니다.
        fi

        echo "DAEMON_TAG=$DAEMON_TAG" >> $GITHUB_ENV
        echo "CNI_TAG=$CNI_TAG" >> $GITHUB_ENV

        echo "Resolved Tags -> Daemon: $DAEMON_TAG, CNI: $CNI_TAG"

    - name: Update Flannel CNI
      run: |
        echo "=== 1. Deploying to Kubernetes Cluster ==="

        NS="kube-flannel"
        DS="kube-flannel-ds"
        CONTAINER="kube-flannel"

        # [3] 결정된 태그 사용
        DAEMON_IMAGE="${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ env.DAEMON_TAG }}"

        # CNI 이미지는 아까 정한 이름(my-cni-plugin)과 동적 태그 사용
        CNI_IMAGE="${{ secrets.DOCKER_USERNAME }}/my-cni-plugin:${{ env.CNI_TAG }}"

        echo "Target: $NS / $DS"
        echo "Daemon Image: $DAEMON_IMAGE"
        echo "CNI Image:    $CNI_IMAGE"

        # 메인 컨테이너와 Init 컨테이너 동시 교체
        kubectl set image daemonset/$DS -n $NS \
          $CONTAINER=$DAEMON_IMAGE \
          install-cni-plugin=$CNI_IMAGE

        # 재시작 트리거
        kubectl rollout restart daemonset/$DS -n $NS

        # 완료 대기
        kubectl rollout status daemonset/$DS -n $NS

        echo "=== Flannel Update Complete! ==="
        kubectl get ds $DS -n $NS -o wide

  # [Job 3] 네트워크 검증 (Ping Test)
  e2e-test:
    needs: deploy
    runs-on: [ self-hosted, linux ]
    steps:
    # 1. 스크립트 파일이 들어있는 소스코드를 가져옵니다.
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 스크립트 실행 권한을 주고 실행합니다.
    - name: Run Network Connectivity Test Script
      run: |
        chmod +x ./scripts/test-connectivity.sh
        ./scripts/test-connectivity.sh
