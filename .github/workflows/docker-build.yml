name: Build and Push Flannel (AMD64)

on:
  push:
    branches:
    - main
    - 'feat/**'
  workflow_dispatch:


jobs:
  # [Job 1] 빌드 및 푸시
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        file: images/Dockerfile
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:latest
        build-args: |
          TAG=${{ github.sha }}

  # [Job 2] 배포 (이미지 교체)
  deploy:
    needs: build-and-push
    runs-on: [ self-hosted, linux ]
    steps:
    - name: Update Flannel CNI
      run: |
        echo "=== 1. Deploying to Kubernetes Cluster ==="

        NS="kube-flannel"
        DS="kube-flannel-ds"
        CONTAINER="kube-flannel"

        # 1. 데몬 이미지 (현재 레포에서 빌드된 SHA)
        DAEMON_IMAGE="${{ secrets.DOCKER_USERNAME }}/my-custom-flannel:${{ github.sha }}"

        # ▼▼▼ [추가] CNI 플러그인 이미지 (CNI 레포에서 빌드된 latest) ▼▼▼
        CNI_IMAGE="${{ secrets.DOCKER_USERNAME }}/my-cni-plugin:latest"

        echo "Target: $NS / $DS"
        echo "Daemon Image: $DAEMON_IMAGE"
        echo "CNI Image:    $CNI_IMAGE"

        # ▼▼▼ [수정] 메인 컨테이너와 Init 컨테이너 동시 교체 ▼▼▼
        kubectl set image daemonset/$DS -n $NS \
          $CONTAINER=$DAEMON_IMAGE \
          install-cni-plugin=$CNI_IMAGE

        # 재시작 트리거
        kubectl rollout restart daemonset/$DS -n $NS

        # 완료 대기
        kubectl rollout status daemonset/$DS -n $NS

        echo "=== Flannel Update Complete! ==="
        kubectl get ds $DS -n $NS -o wide

  # [Job 3] 네트워크 검증 (Ping Test)
  e2e-test:
    needs: deploy
    runs-on: [ self-hosted, linux ]
    steps:
    # 1. 스크립트 파일이 들어있는 소스코드를 가져옵니다.
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. 스크립트 실행 권한을 주고 실행합니다.
    - name: Run Network Connectivity Test Script
      run: |
        chmod +x ./scripts/test-connectivity.sh
        ./scripts/test-connectivity.sh
